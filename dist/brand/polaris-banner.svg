<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="polarisCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Constellation Mesh -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.5">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <circle cx="200" cy="200" r="140" stroke-dasharray="4 6" fill="none" />
    <circle cx="1000" cy="200" r="160" stroke-dasharray="3 5" fill="none" />
  </g>

  <!-- Big North Star Polaris -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="80" fill="url(#polarisCore)" opacity="0.25" filter="url(#glow)" />
    <polygon points="0,-110 24,-24 110,0 24,24 0,110 -24,24 -110,0 -24,-24" fill="url(#polarisCore)" />
    <polygon points="0,-70 16,-16 70,0 16,16 0,70 -16,16 -70,0 -16,-16" fill="url(#goldGlow)" opacity="0.9" />
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="#38BDF8" />
  </g>

  <!-- Main Banner Title -->
  <text x="360" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="900" letter-spacing="3" fill="url(#textGrad)">
    POLARIS<tspan fill="#38BDF8">ERP</tspan>
  </text>
  
  <text x="365" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#94A3B8">
    AUTONOMOUS ENTERPRISE ERP • CRM • MULTI-WAREHOUSE WMS
  </text>

  <text x="365" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748B">
    Full sales pipeline, bin allocation, stock reconciliation, and AGENTS.md autonomous automation.
  </text>

  <!-- Sovereign Agency Badge -->
  <g transform="translate(365, 300)">
    <rect width="210" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="18" cy="17" r="6" fill="#10B981" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">
      WTFEAR AGENCY SOVEREIGN
    </text>
  </g>
  <g transform="translate(595, 300)">
    <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="0.5">
      100% PURE MIT LICENSE
    </text>
  </g>
</svg>